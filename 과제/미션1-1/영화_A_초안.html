<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 영화 취향 지도</title>
<style>
:root{color-scheme:light;--paper:#f5f3ec;--ink:#222a27;--green:#215646;--line:#dedfd4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:960px;margin:auto;padding:48px 22px}header{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--green);font-weight:800}h1{font-size:clamp(28px,6vw,46px);margin:10px 0;letter-spacing:-.05em}p{line-height:1.6}.lead{color:#59665d}form{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}input{min-width:0;flex:1 1 210px;padding:13px;border:1px solid var(--line);border-radius:9px;font:inherit}button{font:inherit;cursor:pointer}form button{padding:12px 17px;border:1px solid var(--green);background:var(--green);color:white;border-radius:9px}form .secondary{background:transparent;color:var(--green)}#status{min-height:24px;color:var(--green);font-size:14px}.board{display:grid;gap:12px}.row{display:flex;min-height:90px;background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.label{width:76px;flex-shrink:0;border:0;background:var(--color);font-weight:800;font-size:24px;color:#25302a}.zone{min-width:0;display:flex;flex:1;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:14px}.card{background:#f0f1e9;border:1px solid #d7ddce;border-radius:8px;padding:11px 14px;max-width:100%;overflow-wrap:anywhere;text-align:left;color:var(--ink)}.card[aria-pressed=true]{outline:3px solid var(--green);background:#e0efdf}.pool .label{font-size:15px;background:#d8ded4}footer{margin-top:22px;color:#6b756e;font-size:12px}:focus-visible{outline:3px solid #a1582d;outline-offset:3px}@media(max-width:440px){main{padding:24px 12px}.label{width:50px}.zone{padding:10px}.card{font-size:14px;padding:9px}.pool .label{font-size:12px}}
</style></head><body><main><header><div class="eyebrow">나만의 영화 기록</div><h1>나의 영화 취향 지도</h1><p class="lead">좋았던 장면을 떠올리며, 내 취향대로 한 편씩 정리하세요.</p><form id="add-form"><input id="title" aria-label="영화 제목" placeholder="추가할 영화 제목" maxlength="100"><button>추가</button><button class="secondary" id="reset" type="button">처음으로</button></form></header><p id="status" role="status">영화를 선택한 뒤 옮길 등급을 눌러 주세요.</p><section id="board" class="board" aria-label="영화 등급"></section><footer>이 브라우저에 자동 저장됩니다. 다른 사람이나 다른 기기와는 공유되지 않습니다.</footer></main>
<script>
const KEY='minjin-mission1-A-v1';
const titles=['기생충','인터스텔라','라라랜드','센과 치히로의 행방불명','어벤져스: 엔드게임','범죄도시','타이타닉','토이 스토리'];
const levels=['S','A','B','C','D','pool'];const colors=['#eeaaa0','#f0c293','#ebdb9c','#bfdbad','#b5d4dc','#d8ded4'];
const initial=()=>({nextId:9,items:titles.map((title,i)=>({id:'m'+(i+1),title,tier:'pool'}))});
let state=initial(),selected=null;let storageOK=true;
try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(data&&Number.isSafeInteger(data.nextId)&&data.nextId>=9&&Array.isArray(data.items)&&data.items.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&levels.includes(x.tier))&&new Set(data.items.map(x=>x.id)).size===data.items.length)state=data;}catch{storageOK=false;}
const status=document.getElementById('status');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}}
function say(s){status.textContent=s+(storageOK?'':' ※ 저장할 수 없어 다시 열면 초기화될 수 있어요.');}
function render(){const board=document.getElementById('board');board.replaceChildren();levels.forEach((level,i)=>{const row=document.createElement('div');row.className='row'+(level==='pool'?' pool':'');row.style.setProperty('--color',colors[i]);const label=document.createElement('button');label.type='button';label.className='label';label.textContent=level==='pool'?'미분류':level;label.setAttribute('aria-label',(level==='pool'?'미분류':level)+'로 옮기기');label.addEventListener('click',()=>{const movie=state.items.find(x=>x.id===selected);if(!movie){say('먼저 영화 카드를 선택해 주세요.');return;}movie.tier=level;selected=null;save();render();say(movie.title+' 이동 완료');});const zone=document.createElement('div');zone.className='zone';zone.dataset.tier=level;state.items.filter(x=>x.tier===level).forEach(movie=>{const card=document.createElement('button');card.className='card';card.type='button';card.textContent=movie.title;card.setAttribute('aria-pressed',String(selected===movie.id));card.addEventListener('click',()=>{selected=selected===movie.id?null:movie.id;render();say(selected?movie.title+' 선택됨. 옮길 등급을 눌러 주세요.':'선택을 해제했어요.');});zone.append(card);});row.append(label,zone);board.append(row);});}
document.getElementById('add-form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('title');const title=input.value.trim();if(!title){say('영화 제목을 입력해 주세요.');input.focus();return;}if(state.items.some(x=>x.title===title)){say('이미 등록한 영화입니다.');return;}state.items.push({id:'m'+state.nextId++,title,tier:'pool'});input.value='';save();render();say('새 영화를 추가했어요.');});
document.getElementById('reset').addEventListener('click',()=>{state=initial();selected=null;document.getElementById('title').value='';save();render();say('초기 영화 8개로 돌아왔어요.');});render();if(!storageOK)say('영화를 선택한 뒤 옮길 등급을 눌러 주세요.');
</script></body></html>
