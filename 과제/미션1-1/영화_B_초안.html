<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 영화 티어리스트</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;

            --tier-s: #ff7f7f;
            --tier-a: #ffbf7f;
            --tier-b: #ffdf7f;
            --tier-c: #ffff7f;
            --tier-d: #bfff7f;
            --tier-unranked: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Controls Section */
        .controls {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .add-form {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 280px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            white-space: nowrap;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-reset {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .btn-reset:hover {
            background-color: #334155;
            color: var(--text-color);
        }

        /* Alert Toast */
        .alert {
            display: none;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger-color);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            width: 100%;
        }

        /* Tier Board */
        .tier-board {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tier-row {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 80px;
        }

        .tier-label {
            width: 70px;
            min-width: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
        }

        .tier-s { background-color: var(--tier-s); }
        .tier-a { background-color: var(--tier-a); }
        .tier-b { background-color: var(--tier-b); }
        .tier-c { background-color: var(--tier-c); }
        .tier-d { background-color: var(--tier-d); }
        .tier-unranked-label { 
            background-color: var(--tier-unranked); 
            color: #f8fafc;
            font-size: 1rem;
        }

        .tier-content {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        /* Movie Card */
        .movie-card {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .movie-card:hover {
            border-color: #64748b;
        }

        .movie-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
            background-color: #1e1b4b;
        }

        .movie-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .movie-title {
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1;
            padding: 0 4px;
            border-radius: 4px;
        }

        .btn-delete:hover {
            color: var(--danger-color);
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Tier Selector Buttons inside card */
        .tier-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .btn-tier {
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            background-color: #334155;
            color: var(--text-color);
            border: 1px solid transparent;
        }

        .btn-tier:hover {
            opacity: 0.9;
        }

        .btn-tier.active {
            box-shadow: inset 0 0 0 1px #fff;
        }

        .btn-tier[data-tier="S"] { background-color: #b91c1c; color: #fff; }
        .btn-tier[data-tier="A"] { background-color: #c2410c; color: #fff; }
        .btn-tier[data-tier="B"] { background-color: #b45309; color: #fff; }
        .btn-tier[data-tier="C"] { background-color: #a16207; color: #fff; }
        .btn-tier[data-tier="D"] { background-color: #15803d; color: #fff; }
        .btn-tier[data-tier="UNRANKED"] { background-color: #475569; color: #fff; }

        .empty-msg {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            padding: 8px;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .tier-row {
                flex-direction: column;
            }
            .tier-label {
                width: 100%;
                min-width: 100%;
                height: 36px;
                font-size: 1.2rem;
            }
            .tier-unranked-label {
                font-size: 0.9rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .add-form {
                flex-direction: column;
                min-width: 100%;
            }
            .btn-reset {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>내 영화 티어리스트</h1>
        <p class="subtitle">본 영화를 등급별로 정리하고 취향을 기록해보세요.</p>
    </header>

    <section class="controls">
        <form class="add-form" id="addMovieForm" onsubmit="handleAddMovie(event)">
            <input type="text" id="movieTitleInput" placeholder="영화 제목을 입력하세요 (예: 기생충)" autocomplete="off">
            <button type="submit" class="btn-primary">영화 추가</button>
        </form>
        <button type="button" class="btn-reset" onclick="handleReset()">처음으로 (초기화)</button>
        <div id="alertBox" class="alert">영화 제목을 입력해 주세요. (공백만 입력할 수 없습니다)</div>
    </section>

    <main class="tier-board" id="tierBoard">
        <!-- Tier S -->
        <div class="tier-row">
            <div class="tier-label tier-s">S</div>
            <div class="tier-content" id="tier-S"></div>
        </div>
        <!-- Tier A -->
        <div class="tier-row">
            <div class="tier-label tier-a">A</div>
            <div class="tier-content" id="tier-A"></div>
        </div>
        <!-- Tier B -->
        <div class="tier-row">
            <div class="tier-label tier-b">B</div>
            <div class="tier-content" id="tier-B"></div>
        </div>
        <!-- Tier C -->
        <div class="tier-row">
            <div class="tier-label tier-c">C</div>
            <div class="tier-content" id="tier-C"></div>
        </div>
        <!-- Tier D -->
        <div class="tier-row">
            <div class="tier-label tier-d">D</div>
            <div class="tier-content" id="tier-D"></div>
        </div>
        <!-- Unranked -->
        <div class="tier-row">
            <div class="tier-label tier-unranked-label">미분류</div>
            <div class="tier-content" id="tier-UNRANKED"></div>
        </div>
    </main>
</div>

<script>
    const INITIAL_MOVIES = [
        '기생충',
        '인터스텔라',
        '라라랜드',
        '센과 치히로의 행방불명',
        '어벤져스: 엔드게임',
        '범죄도시',
        '타이타닉',
        '토이 스토리'
    ];

    const STORAGE_KEY = 'my_movie_tierlist_data';
    const TIERS = ['S', 'A', 'B', 'C', 'D', 'UNRANKED'];

    let movies = [];
    let selectedId = null;

    function initData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                movies = JSON.parse(saved);
            } catch (e) {
                movies = createDefaultData();
            }
        } else {
            movies = createDefaultData();
        }
        saveData();
        render();
    }

    function createDefaultData() {
        return INITIAL_MOVIES.map((title, index) => ({
            id: 'movie_' + Date.now() + '_' + index,
            title: title,
            tier: 'UNRANKED'
        }));
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    }

    function showAlert(msg) {
        const alertBox = document.getElementById('alertBox');
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 3000);
    }

    function handleAddMovie(e) {
        e.preventDefault();
        const input = document.getElementById('movieTitleInput');
        const title = input.value.trim();

        if (!title) {
            showAlert('영화 제목을 입력해 주세요. (공백만 입력할 수 없습니다)');
            return;
        }

        const newMovie = {
            id: 'movie_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            title: title,
            tier: 'UNRANKED'
        };

        movies.push(newMovie);
        saveData();
        render();
        input.value = '';
    }

    function handleMoveTier(id, targetTier, e) {
        if (e) e.stopPropagation();
        const movie = movies.find(m => m.id === id);
        if (movie) {
            movie.tier = targetTier;
            saveData();
            render();
        }
    }

    function handleDeleteMovie(id, e) {
        if (e) e.stopPropagation();
        movies = movies.filter(m => m.id !== id);
        if (selectedId === id) selectedId = null;
        saveData();
        render();
    }

    function handleSelectCard(id) {
        selectedId = (selectedId === id) ? null : id;
        render();
    }

    function handleReset() {
        if (confirm('모든 변경 사항이 초기화되고 초기 8개 영화만 미분류로 돌아갑니다. 계속하시겠습니까?')) {
            movies = createDefaultData();
            selectedId = null;
            saveData();
            render();
        }
    }

    function render() {
        TIERS.forEach(tier => {
            const container = document.getElementById(`tier-${tier}`);
            container.innerHTML = '';
        });

        const tierCounts = { S: 0, A: 0, B: 0, C: 0, D: 0, UNRANKED: 0 };

        movies.forEach(movie => {
            const container = document.getElementById(`tier-${movie.tier}`);
            if (!container) return;

            tierCounts[movie.tier]++;

            const card = document.createElement('div');
            card.className = `movie-card ${selectedId === movie.id ? 'selected' : ''}`;
            card.onclick = () => handleSelectCard(movie.id);

            const header = document.createElement('div');
            header.className = 'movie-header';

            const titleSpan = document.createElement('span');
            titleSpan.className = 'movie-title';
            titleSpan.textContent = movie.title;

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.innerHTML = '&times;';
            delBtn.title = '삭제';
            delBtn.onclick = (e) => handleDeleteMovie(movie.id, e);

            header.appendChild(titleSpan);
            header.appendChild(delBtn);

            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'tier-buttons';

            TIERS.forEach(t => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `btn-tier ${movie.tier === t ? 'active' : ''}`;
                btn.setAttribute('data-tier', t);
                btn.textContent = t === 'UNRANKED' ? '미분류' : t;
                btn.onclick = (e) => handleMoveTier(movie.id, t, e);
                buttonsDiv.appendChild(btn);
            });

            card.appendChild(header);
            card.appendChild(buttonsDiv);
            container.appendChild(card);
        });

        TIERS.forEach(tier => {
            if (tierCounts[tier] === 0) {
                const container = document.getElementById(`tier-${tier}`);
                const emptySpan = document.createElement('span');
                emptySpan.className = 'empty-msg';
                emptySpan.textContent = '비어 있음';
                container.appendChild(emptySpan);
            }
        });
    }

    document.addEventListener('keydown', (e) => {
        if (!selectedId) return;
        if (document.activeElement.tagName === 'INPUT') return;

        const key = e.key.toUpperCase();
        if (['S', 'A', 'B', 'C', 'D'].includes(key)) {
            handleMoveTier(selectedId, key, null);
        } else if (key === 'U' || e.key === 'Backspace') {
            handleMoveTier(selectedId, 'UNRANKED', null);
        }
    });

    window.onload = initData;
</script>
</body>
</html>
