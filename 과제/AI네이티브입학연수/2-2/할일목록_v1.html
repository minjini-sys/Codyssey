<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6f0">
<title>나의 할 일 · 할일목록</title>
<style>
:root{color-scheme:light;--ink:#26372d;--muted:#657267;--green:#345e43;--line:#dfe5da;--paper:#fffefb}*{box-sizing:border-box}body{margin:0;background:#f5f6f0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}button,input{font:inherit}button{cursor:pointer;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 16px;font-weight:600}button:hover{background:#edf1e8}button:focus-visible,input:focus-visible{outline:3px solid #84a77b;outline-offset:3px}.app{width:min(100% - 40px,760px);margin:60px auto 40px}.eyebrow{margin:0 0 12px;color:var(--green);font-size:12px;font-weight:750;letter-spacing:.2em}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:clamp(30px,6vw,42px);letter-spacing:-.06em;line-height:1.25;margin:0}.date-today{font-size:13px;color:var(--muted);white-space:nowrap}.intro{margin:14px 0 28px;color:var(--muted)}.composer{padding:26px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 30px #293f2605}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.optional{color:var(--muted);font-weight:400;margin-left:5px}input[type=text],input[type=date],input[type=time]{display:block;width:100%;min-width:0;max-width:100%;min-height:48px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 12px}input::placeholder{color:#7b857c}.form-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:18px}.form-bottom>div{min-width:0}.primary{background:var(--green);color:#fff;border-color:var(--green);min-height:48px;padding-inline:25px}.primary:hover{background:#274a34}.hint{font-size:12px;color:var(--muted);margin:14px 0 0}.error{color:#a2352c;margin:10px 0 0;font-size:13px}.error:empty{display:none}.overview{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:30px 0 16px}.overview h2{font-size:17px;margin:0}.summary{color:var(--muted);font-size:13px}.progress{width:100%;height:5px;overflow:hidden;background:#e1e6dc;border-radius:8px;margin-bottom:24px}.progress-fill{height:100%;background:#77976b;width:0;transition:width .2s}.filters{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:14px}.filter{border-color:transparent;background:transparent;padding:8px 16px;color:var(--muted)}.filter[aria-pressed=true]{background:#e4ebdd;color:#294e34}.count{font-size:12px;margin-left:5px}.tasks{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}.task{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}.task-row{display:flex;gap:13px;align-items:start}.check-label{margin:-4px 0 0 -6px;display:flex;align-items:center;justify-content:center;width:44px;min-width:44px;height:44px;cursor:pointer}.check-label input{accent-color:var(--green);width:21px;height:21px;cursor:pointer;margin:0}.task-body{flex:1;min-width:0;padding-top:3px}.task-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.done .task-text{text-decoration:line-through;color:#6c766d}.task-date{display:block;color:var(--muted);font-size:12px;margin-top:5px}.actions{display:flex;gap:5px;flex-shrink:0}.actions button{font-size:12px;padding:7px 11px;background:transparent;border-color:transparent}.actions button:hover{background:#edf1e8}.actions .delete{color:#92564b}.empty{text-align:center;border:1px dashed #cfd8c8;border-radius:18px;padding:42px 20px;margin:18px 0}.empty-icon{margin:0 auto 14px;display:grid;place-items:center;width:45px;height:45px;background:#e9eee2;border-radius:15px;font-size:22px;color:#68835b}.empty h3{margin:0 0 7px;font-size:15px}.empty p{margin:0;font-size:13px;color:var(--muted)}.edit-actions{display:flex;justify-content:end;gap:8px;margin-top:16px}footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}[hidden]{display:none!important}@media(max-width:540px){.app{width:calc(100% - 32px);margin-top:32px}.heading{align-items:start;flex-direction:column;gap:8px}.intro{font-size:14px;margin-top:12px}.composer{padding:20px}.form-bottom{grid-template-columns:minmax(0,1fr);gap:14px}.task-row{flex-wrap:wrap;gap:8px}.task-body{flex-basis:calc(100% - 52px)}.actions{width:100%;justify-content:end;border-top:1px solid #edf0e8;padding-top:8px;margin-top:5px}.overview{align-items:start;flex-direction:column;gap:3px}.filter{padding-inline:12px}.edit-actions button{flex:1}}
</style>
</head>
<body>
<main class="app">
<header><p class="eyebrow">MY DAILY NOTES</p><div class="heading"><h1>하나씩, 나의 할 일</h1><time class="date-today" id="today"></time></div><p class="intro">기억할 일은 여기에 적고, 오늘에 집중해 보세요.</p></header>
<form id="add-form" class="composer" novalidate>
<label for="task-content">어떤 일을 할까요?</label><input id="task-content" name="content" type="text" placeholder="예: 과제 제출하기" autocomplete="off" aria-describedby="add-error">
<div class="form-bottom"><div><label for="task-date">날짜<span class="optional">선택</span></label><input id="task-date" name="date" type="date" aria-describedby="add-error"></div><div><label for="task-time">시간<span class="optional">선택</span></label><input id="task-time" name="time" type="time" aria-describedby="add-error"></div><button class="primary" type="submit">+ 추가</button></div>
<p class="hint">내용만 적어도 괜찮아요. 약속이 있다면 날짜와 시간을 더해 주세요.</p><p id="add-error" class="error" role="alert"></p>
</form>
<section aria-labelledby="list-title"><div class="overview"><h2 id="list-title">나의 목록</h2><span id="summary" class="summary"></span></div><div id="progress" class="progress" role="progressbar" aria-label="할 일 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
<nav class="filters" aria-label="할 일 보기"><button class="filter" type="button" data-filter="all" aria-pressed="true">전체<span id="count-all" class="count">0</span></button><button class="filter" type="button" data-filter="active" aria-pressed="false">미완료<span id="count-active" class="count">0</span></button><button class="filter" type="button" data-filter="done" aria-pressed="false">완료<span id="count-done" class="count">0</span></button></nav>
<ul id="tasks" class="tasks" aria-label="할 일 목록"></ul><div id="empty" class="empty"><div class="empty-icon" aria-hidden="true">✓</div><h3 id="empty-title">등록된 할 일이 없습니다</h3><p id="empty-description">작은 일 하나부터 기록해 보세요.</p></div></section>
<p id="storage-error" class="error" role="alert"></p><p id="status" class="sr-only" role="status" aria-live="polite"></p><footer>이 브라우저에 자동 저장됩니다.<br>날짜와 시간은 확인용이며, 알림은 보내지 않아요.</footer>
</main>
<template id="edit-template"><form class="edit-form" novalidate><label data-label="content">할 일 내용</label><input name="content" type="text" autocomplete="off"><div class="form-bottom"><div><label data-label="date">날짜<span class="optional">선택</span></label><input name="date" type="date"></div><div><label data-label="time">시간<span class="optional">선택</span></label><input name="time" type="time"></div></div><p class="error" role="alert"></p><div class="edit-actions"><button type="button" data-action="cancel">취소</button><button class="primary" type="submit">저장</button></div></form></template>
<script>
'use strict';
const STORAGE_KEY='student-todo-v1';
const $=selector=>document.querySelector(selector);
let tasks=[],filter='all',editingId=null;
const storageError=$('#storage-error');
function validDate(value){if(value==='')return true;if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const d=new Date(value+'T00:00:00');return !Number.isNaN(d.getTime())&&d.getFullYear()===Number(value.slice(0,4))&&d.getMonth()+1===Number(value.slice(5,7))&&d.getDate()===Number(value.slice(8,10));}
function validTime(value){return value===''||/^([01]\d|2[0-3]):[0-5]\d$/.test(value);}
function load(){try{const saved=localStorage.getItem(STORAGE_KEY);if(saved===null)return;const data=JSON.parse(saved),ids=new Set();if(!Array.isArray(data)||!data.every(item=>{if(!item||typeof item.id!=='string'||!item.id||ids.has(item.id)||typeof item.content!=='string'||!item.content.trim()||typeof item.done!=='boolean'||typeof item.date!=='string'||typeof item.time!=='string'||!validDate(item.date)||!validTime(item.time)||(item.time&&!item.date))return false;ids.add(item.id);return true;}))throw new Error('Invalid saved data');tasks=data;}catch(error){storageError.textContent='저장된 목록을 불러오지 못했습니다. 브라우저의 저장 권한이나 저장 데이터를 확인해 주세요.';}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));storageError.textContent='';}catch(error){storageError.textContent='자동 저장을 하지 못했습니다. 현재 창에서는 사용할 수 있지만, 창을 닫으면 변경 사항이 사라질 수 있습니다.';}}
function announce(message){$('#status').textContent=message;}
function readForm(form){const content=form.elements.content.value.trim(),date=form.elements.date.value,time=form.elements.time.value,error=form.querySelector('.error');error.textContent='';for(const input of form.querySelectorAll('input'))input.removeAttribute('aria-invalid');let field;if(!content){error.textContent='할 일을 입력해 주세요';field='content';}else if(time&&!date){error.textContent='날짜를 선택해 주세요';field='date';}else if(!validDate(date)||!form.elements.date.validity.valid){error.textContent='올바른 날짜를 입력해 주세요';field='date';}else if(!validTime(time)||!form.elements.time.validity.valid){error.textContent='올바른 시간을 입력해 주세요';field='time';}if(field){form.elements[field].setAttribute('aria-invalid','true');form.elements[field].focus();return null;}return{content,date,time};}
function button(text,action,task){const element=document.createElement('button');element.type='button';element.textContent=text;element.dataset.action=action;element.className=action;element.setAttribute('aria-label',task.content+' '+text);return element;}
function focusTask(id,action){const item=Array.from($('#tasks').children).find(element=>element.dataset.id===id);if(item)item.querySelector('[data-action="'+action+'"]').focus();}
function render(){
 const done=tasks.filter(task=>task.done).length;
 $('#count-all').textContent=tasks.length;$('#count-active').textContent=tasks.length-done;$('#count-done').textContent=done;
 $('#summary').textContent=tasks.length?'전체 '+tasks.length+'개 중 '+done+'개 완료':'오늘의 작은 시작을 기다리고 있어요';
 const percent=tasks.length?Math.round(done/tasks.length*100):0;$('#progress').setAttribute('aria-valuenow',percent);$('#progress-fill').style.width=percent+'%';
 document.querySelectorAll('[data-filter]').forEach(element=>element.setAttribute('aria-pressed',String(element.dataset.filter===filter)));
 const visible=tasks.filter(task=>filter==='all'||(filter==='done'?task.done:!task.done));
 $('#empty').hidden=visible.length>0;$('#empty-title').textContent=tasks.length?'해당하는 할 일이 없습니다':'등록된 할 일이 없습니다';$('#empty-description').textContent=tasks.length?(filter==='done'?'하나씩 마치고 완료를 체크해 보세요.':'남은 할 일을 모두 마쳤어요. 수고했어요!'):'작은 일 하나부터 기록해 보세요.';
 const list=$('#tasks');list.replaceChildren();
 visible.forEach(task=>{
  const li=document.createElement('li');li.className='task'+(task.done?' done':'');li.dataset.id=task.id;
  if(editingId===task.id){
   const form=$('#edit-template').content.firstElementChild.cloneNode(true);
   ['content','date','time'].forEach(name=>{const input=form.elements[name];input.value=task[name];input.id='edit-'+name;input.setAttribute('aria-describedby','edit-error');form.querySelector('[data-label="'+name+'"]').htmlFor=input.id;});form.querySelector('.error').id='edit-error';
   form.addEventListener('submit',event=>{event.preventDefault();const values=readForm(form);if(!values)return;Object.assign(task,values);editingId=null;save();render();focusTask(task.id,'edit');announce('할 일을 수정했습니다.');});li.append(form);
  }else{
   const row=document.createElement('div');row.className='task-row';const label=document.createElement('label');label.className='check-label';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=task.done;checkbox.setAttribute('aria-label',task.content+' 완료');
   checkbox.addEventListener('change',()=>{task.done=checkbox.checked;save();render();const item=Array.from(list.children).find(element=>element.dataset.id===task.id);if(item)item.querySelector('input[type="checkbox"]').focus();else document.querySelector('[data-filter="'+filter+'"]').focus();announce(task.done?'완료한 일로 표시했습니다.':'미완료로 변경했습니다.');});label.append(checkbox);
   const body=document.createElement('div');body.className='task-body';const content=document.createElement('p');content.className='task-text';content.textContent=task.content;body.append(content);
   if(task.date){const date=document.createElement('time');date.className='task-date';date.dateTime=task.date+(task.time?'T'+task.time:'');date.textContent=task.date.replaceAll('-','.')+(task.time?' · '+task.time:'');body.append(date);}
   const actions=document.createElement('div');actions.className='actions';actions.append(button('수정','edit',task),button('삭제','delete',task));row.append(label,body,actions);li.append(row);
  }list.append(li);
 });
}
$('#add-form').addEventListener('submit',event=>{event.preventDefault();const values=readForm(event.currentTarget);if(!values)return;const id=typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);tasks.push({id,...values,done:false});filter='all';editingId=null;save();event.currentTarget.reset();render();$('#task-content').focus();announce('할 일을 추가했습니다.');});
document.querySelector('.filters').addEventListener('click',event=>{const target=event.target.closest('[data-filter]');if(!target)return;filter=target.dataset.filter;editingId=null;render();});
$('#tasks').addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const item=target.closest('[data-id]');if(target.dataset.action==='edit'){editingId=item.dataset.id;render();$('#edit-content').focus();}else if(target.dataset.action==='cancel'){editingId=null;render();focusTask(item.dataset.id,'edit');}else if(target.dataset.action==='delete'){const index=tasks.findIndex(task=>task.id===item.dataset.id);if(index<0)return;tasks.splice(index,1);save();render();const next=$('#tasks').querySelector('[data-action="delete"]');(next||$('#task-content')).focus();announce('할 일을 삭제했습니다.');}});
const today=new Date();$('#today').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(today);$('#today').dateTime=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
load();render();
</script>
</body>
</html>
